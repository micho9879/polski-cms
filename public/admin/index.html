<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Panel Administratora - Sveltia CMS</title>
  </head>
  <body>
    <script>
      // Blokada wczytywania ewentualnych starych plików konfiguracyjnych z cache
      window.CMS_MANUAL_INIT = true;
    </script>
    
    <!-- Ładujemy Sveltia CMS -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    
    <script>
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: 'github',
            repo: 'micho9879/polski-cms',
            branch: 'main'
            // Oczyszczono z use_pkce i app_id
          },
          media_folder: 'public/images',
          public_folder: '/images',
          collections: [
            {
              name: 'notatki',
              label: 'Notatki dla uczniów',
              folder: 'public/data/notatki',
              create: true,
              extension: 'json',
              format: 'json',
              fields: [
                { label: 'Tytuł', name: 'title', widget: 'string' },
                { label: 'Kategoria', name: 'category', widget: 'select', options: ['Lektury', 'Gramatyka', 'Matura', 'Inne'], default: 'Inne' },
                { label: 'Miniaturka', name: 'thumbnail', widget: 'image', required: false },
                { label: 'Treść', name: 'content', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
