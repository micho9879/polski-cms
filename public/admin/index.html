<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Panel Administratora</title>
  </head>
  <body>
    <!-- 1. Musimy zablokować automatyczny start CMSa zanim załadujemy skrypt -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    
    <!-- 2. Ładujemy skrypt -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    
    <!-- 3. Odpalamy go ręcznie z flagą wyłączającą config.yml -->
    <script>
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: 'github',
            repo: 'micho9879/polski-cms',
            branch: 'main',
            use_pkce: true,
            app_id: 'Ov23li0ZsiUrwCSnuMxQ'
          },
          media_folder: 'public/images',
          public_folder: '/images',
          collections: [
            {
              name: 'notatki',
              label: 'Notatki dla uczniów',
              folder: 'public/data/notatki',
              create: true,
              extension: 'json',
              format: 'json',
              fields: [
                { label: 'Tytuł', name: 'title', widget: 'string' },
                { label: 'Miniaturka', name: 'thumbnail', widget: 'image', required: false },
                { label: 'Treść', name: 'content', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
