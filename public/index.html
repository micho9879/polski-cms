<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiały do języka polskiego</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- Google Fonts: Lora for titles/reading, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Subtelny wzór kropek dla clean designu */
        .bg-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-dots text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-slate-200 selection:text-slate-900">
    
    <!-- Main Content -->
    <main class="flex-grow w-full">
        <!-- SPA: Główny widok -->
        <div id="home-view">
            <!-- Nowy Hero Section: Clean & Minimalist -->
            <header class="pt-24 pb-16 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto text-center">
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold font-serif text-slate-900 tracking-tight leading-tight">
                    Materiały do języka polskiego
                </h1>
                <p class="mt-6 text-lg md:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
                    Baza wiedzy, opracowania lektur i repetytorium.
                </p>
                
                <div class="mt-12 max-w-xl mx-auto relative group">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="search-input" class="block w-full pl-12 pr-4 min-h-[56px] rounded-2xl border border-slate-200 shadow-sm focus:border-slate-400 focus:ring-4 focus:ring-slate-100 sm:text-lg text-slate-900 bg-white transition-all outline-none" placeholder="Szukaj notatki...">
                </div>
            </header>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
                <div class="mb-10">
                    <nav id="category-tabs" class="flex flex-wrap justify-center gap-2 md:gap-3" aria-label="Tabs">
                    </nav>
                </div>
                
                <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
                
                <div id="no-results" class="hidden text-center py-20">
                    <p class="text-slate-500 text-lg">Brak wyników do wyświetlenia.</p>
                </div>
            </div>
        </div>

        <!-- SPA: Widok artykułu -->
        <div id="article-view" class="hidden relative pb-20">
            <!-- Przyklejony górny pasek nawigacji artykułu -->
            <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm">
                <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center">
                    <button id="back-btn" class="inline-flex items-center text-slate-600 hover:text-slate-900 font-medium min-h-[44px] px-2 transition-colors">
                        <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Wróć do materiałów
                    </button>
                </div>
            </div>

            <!-- Treść artykułu -->
            <div id="article-content" class="pt-10">
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto py-8">
        <p class="text-center text-slate-500 text-sm font-medium">&copy; 2026 Nauczyciel Języka Polskiego.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
