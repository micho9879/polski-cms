<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiały do języka polskiego</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- Google Fonts: Lora for titles/reading, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bg-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Wzór kropek dla dark mode */
        html.dark .bg-dots {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }
    </style>
    
    <!-- Skrypt sprawdzający motyw przed wyrenderowaniem drzewa DOM, by zapobiec miganiu jasnego motywu -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-dots text-slate-800 dark:text-slate-300 font-sans min-h-screen flex flex-col antialiased selection:bg-slate-300 selection:text-slate-900 dark:selection:bg-indigo-500 dark:selection:text-white transition-colors duration-300">
    
    <!-- Main Content -->
    <main class="flex-grow w-full">
        <!-- SPA: Główny widok -->
        <div id="home-view">
            <!-- Nowy Hero Section: Clean & Minimalist ze wsparciem Dark Mode -->
            <header class="pt-20 pb-16 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto text-center relative">
                <!-- Przełącznik Dark Mode -->
                <div class="absolute top-4 right-4 sm:top-8 sm:right-8">
                    <button id="theme-toggle-home" class="p-2.5 bg-white dark:bg-slate-800 rounded-full shadow-sm border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all focus:outline-none">
                        <!-- Słońce dla Dark Mode (aby włączyć jasny) -->
                        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <!-- Księżyc dla Light Mode (aby włączyć ciemny) -->
                        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>
                
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold font-serif text-slate-900 dark:text-slate-100 tracking-tight leading-tight mt-6">
                    Materiały do języka polskiego
                </h1>
                <p class="mt-6 text-lg md:text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto leading-relaxed">
                    Baza wiedzy, opracowania lektur i repetytorium.
                </p>
                
                <div class="mt-12 max-w-xl mx-auto relative group">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="search-input" class="block w-full pl-12 pr-4 min-h-[56px] rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm focus:border-indigo-400 dark:focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 sm:text-lg text-slate-900 dark:text-slate-100 bg-white dark:bg-slate-800 transition-all outline-none" placeholder="Szukaj notatki...">
                </div>
            </header>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
                <div class="mb-10">
                    <nav id="category-tabs" class="flex flex-wrap justify-center gap-2 md:gap-3" aria-label="Tabs">
                        <!-- Zakładki renderowane przez app.js -->
                    </nav>
                </div>
                
                <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
                
                <div id="no-results" class="hidden text-center py-20">
                    <p class="text-slate-500 dark:text-slate-400 text-lg">Brak wyników do wyświetlenia.</p>
                </div>
            </div>
        </div>

        <!-- SPA: Widok artykułu -->
        <div id="article-view" class="hidden relative pb-20">
            <!-- Przyklejony górny pasek nawigacji artykułu -->
            <div class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors duration-300">
                <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                    <button id="back-btn" class="inline-flex items-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium min-h-[44px] px-2 transition-colors focus:outline-none">
                        <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Wróć do materiałów
                    </button>
                    <!-- Przełącznik Dark Mode w Navbarze -->
                    <button id="theme-toggle-article" class="p-2 bg-transparent text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors focus:outline-none min-h-[44px] min-w-[44px] flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Treść artykułu generowana dynamicznie w app.js -->
            <div id="article-content"></div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 mt-auto py-8 transition-colors duration-300">
        <p class="text-center text-slate-500 dark:text-slate-400 text-sm font-medium">&copy; 2026 Nauczyciel Języka Polskiego.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
